# Optional: Render Dashboard → New → Blueprint → connect repo with this file.
services:
  - type: web
    name: date-bot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-web.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.11"
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
